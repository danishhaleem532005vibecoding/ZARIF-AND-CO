/* ===== Cart Logic ===== */
/* ============================================================
   Zarif & Co. — Cart Logic (localStorage based)
   Cart item shape: { slug, name, price, image, qty, size, color }
   ============================================================ */

const CART_KEY = "zarif_cart_v1";

function getCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  renderCartBadge();
}

function addToCart(product, qty, size, color) {
  const cart = getCart();
  const existing = cart.find(
    (item) => item.slug === product.slug && item.size === size && item.color === color
  );
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({
      slug: product.slug,
      name: product.name,
      price: product.price,
      image: product.images[0],
      qty: qty,
      size: size,
      color: color,
    });
  }
  saveCart(cart);
}

function removeFromCart(index) {
  const cart = getCart();
  cart.splice(index, 1);
  saveCart(cart);
}

function updateCartQty(index, qty) {
  const cart = getCart();
  if (!cart[index]) return;
  cart[index].qty = Math.max(1, qty);
  saveCart(cart);
}

function clearCart() {
  saveCart([]);
}

function getCartCount() {
  return getCart().reduce((sum, item) => sum + item.qty, 0);
}

function getCartSubtotal() {
  return getCart().reduce((sum, item) => sum + item.qty * item.price, 0);
}

function renderCartBadge() {
  const badge = document.getElementById("cart-count-badge");
  if (!badge) return;
  const count = getCartCount();
  badge.textContent = count;
  badge.style.display = count > 0 ? "flex" : "none";
}

document.addEventListener("DOMContentLoaded", renderCartBadge);

/* ===== Wishlist Logic ===== */
/* ============================================================
   Zarif & Co. — Wishlist logic (localStorage based)
   ============================================================ */

const WISHLIST_KEY = "zarif_wishlist_v1";

function getWishlist() {
  try {
    const raw = localStorage.getItem(WISHLIST_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveWishlist(list) {
  localStorage.setItem(WISHLIST_KEY, JSON.stringify(list));
}

function isWishlisted(slug) {
  return getWishlist().includes(slug);
}

function toggleWishlist(slug) {
  let list = getWishlist();
  if (list.includes(slug)) {
    list = list.filter((s) => s !== slug);
  } else {
    list.push(slug);
  }
  saveWishlist(list);
  return list.includes(slug);
}

  if (badge === "sale") return "bg-burgundy-deep";
  if (badge === "new") return "bg-ink";

function starIcons(rating, size = 14) {
  let html = "";
  for (let i = 0; i < 5; i++) {

    html += `<i data-lucide="star" class="w-[${size}px] h-[${size}px] ${filled ? "text-gold fill-gold" : "text-stone-light"}"></i>`;
  }
  return html;
}

function showToast(message) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.remove("hidden");
  toast.classList.remove("toast");
  void toast.offsetWidth; // restart animation
  toast.classList.add("toast");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => toast.classList.add("hidden"), 3000);
}

function quickAddToCart(slug) {
  const p = getProductBySlug(slug);
  if (!p) return;
  addToCart(p, 1, p.sizes[Math.floor(p.sizes.length / 2)], p.colors[0]);
  showToast(`${p.name} added to cart`);
}

   ============================================================ */

function initMobileMenu() {
  const menuToggle = document.getElementById("menu-toggle");
  const mobileMenu = document.getElementById("mobile-menu");
  const iconMenu = document.getElementById("icon-menu");
  const iconClose = document.getElementById("icon-close");
  if (!menuToggle || !mobileMenu) return;

  let menuOpen = false;
  function closeMenu() {
    menuOpen = false;
    mobileMenu.style.maxHeight = "0";
    mobileMenu.style.opacity = "0";
    mobileMenu.classList.add("pointer-events-none");
    iconMenu && iconMenu.classList.remove("hidden");
    iconClose && iconClose.classList.add("hidden");
  }
  function openMenu() {
    menuOpen = true;
    mobileMenu.style.maxHeight = "28rem";
    mobileMenu.style.opacity = "1";
    mobileMenu.classList.remove("pointer-events-none");
    iconMenu && iconMenu.classList.add("hidden");
    iconClose && iconClose.classList.remove("hidden");
  }
  menuToggle.addEventListener("click", () => (menuOpen ? closeMenu() : openMenu()));
  mobileMenu.querySelectorAll("a").forEach((a) => a.addEventListener("click", closeMenu));
}

function initWishlistButtons() {
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".wishlist-btn");
    if (btn) {
      e.preventDefault();
      const slug = btn.dataset.slug;
      if (slug && typeof toggleWishlist === "function") {
        const active = toggleWishlist(slug);
        btn.classList.toggle("text-burgundy", active);
        btn.classList.toggle("opacity-100", active);
        const icon = btn.querySelector("svg, i");
        if (icon) icon.classList.toggle("fill-burgundy", active);
        if (typeof showToast === "function") showToast(active ? "Added to wishlist" : "Removed from wishlist");
      } else {
        btn.classList.toggle("text-burgundy");
      }
    }
  });
}

function initNewsletterForm() {
  const form = document.getElementById("newsletter-form");
  if (!form) return;
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = form.querySelector("input");
    if (input.value.trim()) {
      const label = document.getElementById("newsletter-label");
      const icon = document.getElementById("newsletter-icon");
      if (label) label.textContent = "Subscribed";
      if (icon) {
        icon.setAttribute("data-lucide", "check");
        if (window.lucide) lucide.createIcons();
      }
      input.value = "";
    }
  });
}

function initSearchToggle() {
  const btn = document.getElementById("search-toggle");
  const panel = document.getElementById("search-panel");
  if (!btn || !panel) return;
  btn.addEventListener("click", () => {
    panel.classList.toggle("hidden");
    if (!panel.classList.contains("hidden")) {
      const input = panel.querySelector("input");
      if (input) input.focus();
    }
  });
  const form = panel.querySelector("form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = form.querySelector("input").value.trim();
      window.location.hash = "#/shop" + (q ? "?q=" + encodeURIComponent(q) : "");
    });
  }
}

function initSite() {
  if (typeof renderHeader === "function") renderHeader();
  if (typeof renderFooter === "function") renderFooter();
  initMobileMenu();
  initWishlistButtons();
  initNewsletterForm();
  initSearchToggle();
  renderCartBadge();
  if (window.lucide) lucide.createIcons();
}

document.addEventListener("DOMContentLoaded", initSite);

           <label class=\"flex items-center gap-2 text-sm\"><input type=\"checkbox\" value=\"kids\" class=\"gender-filter-m accent-ink w-4 h-4\" /> Kids</label>\n            </div>\n          </div>\n          <div>\n            <h3 class=\"text-[11px] uppercase tracking-[0.15em] font-bold text-ink mb-3\">Status</h3>\n            <div class=\"flex flex-wrap gap-3\" id=\"filter-badge-mobile\">\n              <label class=\"flex items-center gap-2 text-sm\"><input type=\"checkbox\" value=\"new\" class=\"badge-filter-m accent-ink w-4 h-4\" /> New</label>\n              <label class=\"flex items-center gap-2 text-sm\"><input type=\"checkbox\" value=\"bestseller\" class=\"badge-filter-m accent-ink w-4 h-4\" /> Best Sellers</label>\n              <label class=\"flex items-center gap-2 text-sm\"><input type=\"checkbox\" value=\"sale\" class=\"badge-filter-m accent-ink w-4 h-4\" /> Sale</label>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"grid grid-cols-2 md:grid-cols-3 gap-x-4 sm:gap-x-6 gap-y-8 lg:gap-y-12\" id=\"grid-shop\"></div>\n      </div>\n    </div>\n  </div>\n</div>",
    init: function(params) {
let state = {
    genders: params.get("gender") ? [params.get("gender")] : [],
    badges: params.get("filter") ? [params.get("filter")] : [],
    price: "all",
    sort: "featured",
    q: params.get("q") || "",
  };

  function syncCheckboxes() {
    document.querySelectorAll(".gender-filter, .gender-filter-m").forEach(cb => cb.checked = state.genders.includes(cb.value));
    document.querySelectorAll(".badge-filter, .badge-filter-m").forEach(cb => cb.checked = state.badges.includes(cb.value));
  }

  function titleForState() {
    if (state.q) return `Search: "${state.q}"`;
    if (state.genders.length === 1) return state.genders[0][0].toUpperCase() + state.genders[0].slice(1);
    if (state.badges.includes("new")) return "New Arrivals";
    if (state.badges.includes("sale")) return "Sale";
    if (state.badges.includes("bestseller")) return "Best Sellers";
    return "Shop All";
  }

  function applyFilters() {
    let items = [...PRODUCTS];

    if (state.q) {
      const q = state.q.toLowerCase();
      items = items.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.fabric.toLowerCase().includes(q));
    }
    if (state.genders.length) items = items.filter(p => state.genders.includes(p.gender));
    if (state.badges.length) items = items.filter(p => state.badges.includes(p.badge));
    if (state.price !== "all") {
      const [min, max] = state.price.split("-").map(Number);
      items = items.filter(p => p.price >= min && p.price <= max);
    }
    if (state.sort === "price-asc") items.sort((a, b) => a.price - b.price);
    if (state.sort === "price-desc") items.sort((a, b) => b.price - a.price);
    if (state.sort === "rating") items.sort((a, b) => b.rating - a.rating);

    document.getElementById("shop-title").textContent = titleForState();
    document.getElementById("breadcrumb-label").textContent = titleForState();
    document.getElementById("results-count").textContent = `Showing ${items.length} product${items.length !== 1 ? "s" : ""}`;
    renderProductGrid("grid-shop", items);
  }

  document.querySelectorAll(".gender-filter, .gender-filter-m").forEach(cb => {
    cb.addEventListener("change", () => {
      const checked = [...document.querySelectorAll(".gender-filter:checked, .gender-filter-m:checked")].map(c => c.value);
      state.genders = [...new Set(checked)];
      syncCheckboxes();
      applyFilters();
    });
  });
  document.querySelectorAll(".badge-filter, .badge-filter-m").forEach(cb => {
    cb.addEventListener("change", () => {
      const checked = [...document.querySelectorAll(".badge-filter:checked, .badge-filter-m:checked")].map(c => c.value);
      state.badges = [...new Set(checked)];
      syncCheckboxes();
      applyFilters();
    });
  });
  document.querySelectorAll('input[name="price"]').forEach(r => {
    r.addEventListener("change", () => { state.price = r.value; applyFilters(); });
  });
  document.getElementById("sort-select").addEventListener("change", (e) => {
    state.sort = e.target.value;
    applyFilters();
  });
  document.getElementById("clear-filters").addEventListener("click", () => {
    state = { genders: [], badges: [], price: "all", sort: "featured", q: "" };
    document.querySelectorAll('input[name="price"]').forEach(r => r.checked = r.value === "all");
    document.getElementById("sort-select").value = "featured";
    syncCheckboxes();
    applyFilters();
  });
  document.getElementById("mobile-filter-toggle").addEventListener("click", () => {
    document.getElementById("mobile-filters").classList.toggle("hidden");
  });

  syncCheckboxes();
  applyFilters();
    }
  },

      btn.classList.add("border-gold");

    title: "About Us \u2014 Zarif &amp; Co.",
    body: "<div>\n  <section class=\"relative w-full h-[45vh] lg:h-[55vh] overflow-hidden bg-ink\">\n    <img src=\"https://images.pexels.com/photos/16777502/pexels-photo-16777502.jpeg?auto=compress&cs=tinysrgb&w=1600\" alt=\"Zarif & Co. craftsmanship\" class=\"w-full h-full object-cover opacity-70\" />\n    <div class=\"absolute inset-0 bg-gradient-to-t from-ink/80 via-ink/20 to-ink/40 flex items-end\">\n      <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 pb-12 lg:pb-16 w-full\">\n        <span class=\"text-[11px] tracking-[0.25em] uppercase text-gold font-medium\">Our Story</span>\n        <h1 class=\"font-display text-4xl sm:text-5xl lg:text-6xl text-cream font-medium tracking-tight mt-3\">About Zarif &amp; Co.</h1>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"py-16 lg:py-24\">\n    <div class=\"mx-auto max-w-3xl px-4 sm:px-6 lg:px-8\">\n      <p class=\"text-[11px] uppercase tracking-[0.2em] text-gold font-semibold mb-4\">Since 2012</p>\n      <h2 class=\"font-display text-2xl sm:text-3xl text-ink tracking-tight leading-snug mb-6\">Where tradition meets the modern wardrobe.</h2>\n      <div class=\"space-y-5 text-[15px] text-ink/80 leading-relaxed\">\n        <p>Zarif &amp; Co. was founded in Lahore with a simple belief: that Pakistani craftsmanship deserves a global stage. What began as a small atelier working with local artisans has grown into a house recognized for its embroidery, tailoring, and commitment to quality \u2014 without ever losing sight of where it started.</p>\n        <p>Every piece we make begins with fabric sourced from trusted mills across Punjab and Sindh, and passes through the hands of embroiderers, tailors, and finishers who have spent decades perfecting their craft. We believe luxury isn't about excess \u2014 it's about intention, in every stitch and seam.</p>\n        <p>Today, we serve customers across Pakistan and abroad, but our process hasn't changed. Each garment is still cut, embroidered, and finished by hand in our Lahore workshop.</p>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"py-16 lg:py-20 bg-cream-dark\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8\">\n      <div class=\"grid sm:grid-cols-3 gap-8 lg:gap-12 text-center\">\n        <div>\n          <p class=\"font-display text-4xl text-ink mb-2\">12+</p>\n          <p class=\"text-sm text-stone tracking-wide\">Years of Craftsmanship</p>\n        </div>\n        <div>\n          <p class=\"font-display text-4xl text-ink mb-2\">40,000+</p>\n          <p class=\"text-sm text-stone tracking-wide\">Happy Customers</p>\n        </div>\n        <div>\n          <p class=\"font-display text-4xl text-ink mb-2\">100%</p>\n          <p class=\"text-sm text-stone tracking-wide\">Handcrafted in Pakistan</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"py-16 lg:py-24\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8\">\n      <div class=\"grid lg:grid-cols-3 gap-6 lg:gap-8\">\n        <div class=\"p-8 bg-cream-dark\">\n          <i data-lucide=\"hand-heart\" class=\"w-7 h-7 text-gold mb-4\" style=\"stroke-width:1.5\"></i>\n          <h3 class=\"font-display text-xl text-ink mb-2\">Handcrafted Quality</h3>\n          <p class=\"text-sm text-ink/70 leading-relaxed\">Every piece is cut, embroidered, and finished by skilled artisans \u2014 never mass-produced.</p>\n        </div>\n        <div class=\"p-8 bg-cream-dark\">\n          <i data-lucide=\"leaf\" class=\"w-7 h-7 text-gold mb-4\" style=\"stroke-width:1.5\"></i>\n          <h3 class=\"font-display text-xl text-ink mb-2\">Responsibly Sourced</h3>\n          <p class=\"text-sm text-ink/70 leading-relaxed\">We partner with local mills and fair-wage workshops across Punjab and Sindh.</p>\n        </div>\n        <div class=\"p-8 bg-cream-dark\">\n          <i data-lucide=\"globe\" class=\"w-7 h-7 text-gold mb-4\" style=\"stroke-width:1.5\"></i>\n          <h3 class=\"font-display text-xl text-ink mb-2\">Worldwide Shipping</h3>\n          <p class=\"text-sm text-ink/70 leading-relaxed\">From Lahore to your doorstep, wherever you are \u2014 carefully packaged and tracked.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"w-full bg-burgundy-deep py-16 lg:py-20\">\n    <div class=\"mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 text-center\">\n      <h2 class=\"font-display text-3xl text-cream tracking-tight mb-4\">Visit Our Flagship Store</h2>\n      <p class=\"text-cream/70 mb-8\">Gulberg III, Lahore, Pakistan \u2014 open daily 11am to 9pm</p>\n      <a href=\"#/contact\" class=\"inline-flex items-center bg-gold text-ink px-8 py-3.5 text-[11px] uppercase tracking-[0.12em] font-bold hover:bg-cream transition-colors duration-300\">Get Directions</a>\n    </div>\n  </section>\n</div>",
    init: null
  },
  "contact": {
    title: "Contact Us \u2014 Zarif &amp; Co.",
    body: "<div>\n  <div class=\"bg-cream-dark border-b border-ink/5\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 lg:py-12\">\n      <p class=\"text-[11px] uppercase tracking-[0.15em] text-stone mb-2\"><a href=\"#/\" class=\"hover:text-gold\">Home</a> / <span class=\"text-ink\">Contact</span></p>\n      <h1 class=\"font-display text-3xl sm:text-4xl lg:text-5xl font-medium text-ink tracking-tight\">Get in Touch</h1>\n      <p class=\"mt-2 text-sm text-stone\">We'd love to hear from you. Reach out with any questions about orders, sizing, or custom work.</p>\n    </div>\n  </div>\n\n  <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-12 lg:py-20\">\n    <div class=\"grid lg:grid-cols-5 gap-10 lg:gap-16\">\n      <div class=\"lg:col-span-3\">\n        <div id=\"contact-form-wrap\">\n          <h2 class=\"font-display text-2xl text-ink mb-6\">Send Us a Message</h2>\n          <form id=\"contact-form\" class=\"space-y-4\">\n            <div class=\"grid sm:grid-cols-2 gap-4\">\n              <input required type=\"text\" placeholder=\"Your Name\" class=\"input-field\" name=\"name\" />\n              <input required type=\"email\" placeholder=\"Email Address\" class=\"input-field\" name=\"email\" />\n            </div>\n            <input type=\"text\" placeholder=\"Subject\" class=\"input-field\" name=\"subject\" />\n            <textarea required rows=\"6\" placeholder=\"Your message...\" class=\"input-field resize-none\" name=\"message\"></textarea>\n            <button type=\"submit\" class=\"inline-flex items-center gap-2 bg-ink text-cream px-8 py-3.5 text-[11px] uppercase tracking-[0.12em] font-bold hover:bg-burgundy transition-colors duration-300\">\n              <i data-lucide=\"send\" class=\"w-4 h-4\" style=\"stroke-width:1.5\"></i> Send Message\n            </button>\n          </form>\n        </div>\n      </div>\n\n      <div class=\"lg:col-span-2 space-y-6\">\n        <div class=\"p-6 bg-cream-dark flex gap-4\">\n          <i data-lucide=\"map-pin\" class=\"w-5 h-5 text-gold shrink-0 mt-0.5\" style=\"stroke-width:1.5\"></i>\n          <div>\n            <h3 class=\"text-sm font-semibold text-ink mb-1\">Flagship Store</h3>\n            <p class=\"text-sm text-ink/70\">Block C, Gulberg III, Lahore, Punjab, Pakistan</p>\n          </div>\n        </div>\n        <div class=\"p-6 bg-cream-dark flex gap-4\">\n          <i data-lucide=\"phone\" class=\"w-5 h-5 text-gold shrink-0 mt-0.5\" style=\"stroke-width:1.5\"></i>\n          <div>\n            <h3 class=\"text-sm font-semibold text-ink mb-1\">Phone / WhatsApp</h3>\n            <p class=\"text-sm text-ink/70\">+92 300 1234567</p>\n          </div>\n        </div>\n        <div class=\"p-6 bg-cream-dark flex gap-4\">\n          <i data-lucide=\"mail\" class=\"w-5 h-5 text-gold shrink-0 mt-0.5\" style=\"stroke-width:1.5\"></i>\n          <div>\n            <h3 class=\"text-sm font-semibold text-ink mb-1\">Email</h3>\n            <p class=\"text-sm text-ink/70\">hello@zarifandco.pk</p>\n          </div>\n        </div>\n        <div class=\"p-6 bg-cream-dark flex gap-4\">\n          <i data-lucide=\"clock\" class=\"w-5 h-5 text-gold shrink-0 mt-0.5\" style=\"stroke-width:1.5\"></i>\n          <div>\n            <h3 class=\"text-sm font-semibold text-ink mb-1\">Store Hours</h3>\n            <p class=\"text-sm text-ink/70\">Daily, 11:00 AM \u2013 9:00 PM</p>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>",
    init: function(params) {
document.getElementById("contact-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = e.target.name.value;
    document.getElementById("contact-form-wrap").innerHTML = `
      <div class="py-10 text-center bg-cream-dark px-6">
        <div class="w-14 h-14 rounded-full bg-ink flex items-center justify-center mx-auto mb-5">
          <i data-lucide="check" class="w-7 h-7 text-cream" style="stroke-width:2"></i>
        </div>
        <h2 class="font-display text-2xl text-ink mb-2">Thank you, ${name.split(" ")[0]}!</h2>
        <p class="text-sm text-stone">Your message has been received. Our team will get back to you within 24 hours.</p>
      </div>`;
    if (window.lucide) lucide.createIcons();
  });
    }
  },
  "wishlist": {
    title: "Wishlist \u2014 Zarif &amp; Co.",
    body: "<div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-10 lg:py-16\">\n  <p class=\"text-[11px] uppercase tracking-[0.15em] text-stone mb-2\"><a href=\"#/\" class=\"hover:text-gold\">Home</a> / <span class=\"text-ink\">Wishlist</span></p>\n  <h1 class=\"font-display text-3xl sm:text-4xl font-medium text-ink tracking-tight mb-8 lg:mb-12\">Your Wishlist</h1>\n\n  <div id=\"wishlist-empty\" class=\"hidden text-center py-20\">\n    <i data-lucide=\"heart\" class=\"w-14 h-14 mx-auto text-stone-light mb-5\" style=\"stroke-width:1\"></i>\n    <h2 class=\"font-display text-2xl text-ink mb-2\">Your wishlist is empty</h2>\n    <p class=\"text-sm text-stone mb-8\">Tap the heart icon on any product to save it here for later.</p>\n    <a href=\"#/shop\" class=\"inline-flex items-center bg-ink text-cream px-8 py-3.5 text-[11px] uppercase tracking-[0.12em] font-bold hover:bg-burgundy transition-colors duration-300\">Browse Products</a>\n  </div>\n\n  <div class=\"grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-4 sm:gap-x-6 gap-y-8 lg:gap-y-12\" id=\"grid-wishlist\"></div>\n</div>",
    init: function(params) {
const saved = getWishlist();
  const items = PRODUCTS.filter(p => saved.includes(p.slug));
  document.getElementById("wishlist-empty").classList.toggle("hidden", items.length > 0);
  renderProductGrid("grid-wishlist", items);
    }
  },
  "account": {
    title: "My Account \u2014 Zarif &amp; Co.",
    body: "<div class=\"mx-auto max-w-md px-4 sm:px-6 py-16 lg:py-24\">\n  <div class=\"text-center mb-8\">\n    <h1 class=\"font-display text-3xl text-ink tracking-tight\">My Account</h1>\n    <p class=\"text-sm text-stone mt-2\">Sign in to view your orders and saved details</p>\n  </div>\n\n  <div class=\"flex border-b border-ink/10 mb-8\">\n    <button id=\"tab-login\" class=\"tab-btn active flex-1 pb-3 text-sm font-medium border-b-2 border-ink text-ink\">Sign In</button>\n    <button id=\"tab-signup\" class=\"tab-btn flex-1 pb-3 text-sm font-medium border-b-2 border-transparent text-stone\">Create Account</button>\n  </div>\n\n  <form id=\"login-form\" class=\"space-y-4\">\n    <input required type=\"email\" placeholder=\"Email Address\" class=\"input-field\" />\n    <input required type=\"password\" placeholder=\"Password\" class=\"input-field\" />\n    <div class=\"flex items-center justify-between text-xs\">\n      <label class=\"flex items-center gap-2 text-ink/70\"><input type=\"checkbox\" class=\"accent-ink\" /> Remember me</label>\n      <a href=\"#\" class=\"text-stone hover:text-gold underline\">Forgot password?</a>\n    </div>\n    <button type=\"submit\" class=\"w-full bg-ink text-cream px-7 py-3.5 text-[11px] uppercase tracking-[0.12em] font-bold hover:bg-burgundy transition-colors duration-300\">Sign In</button>\n  </form>\n\n  <form id=\"signup-form\" class=\"space-y-4 hidden\">\n    <input required type=\"text\" placeholder=\"Full Name\" class=\"input-field\" />\n    <input required type=\"email\" placeholder=\"Email Address\" class=\"input-field\" />\n    <input required type=\"password\" placeholder=\"Create Password\" class=\"input-field\" />\n    <button type=\"submit\" class=\"w-full bg-ink text-cream px-7 py-3.5 text-[11px] uppercase tracking-[0.12em] font-bold hover:bg-burgundy transition-colors duration-300\">Create Account</button>\n  </form>\n\n  <p id=\"account-note\" class=\"text-xs text-stone text-center mt-8 leading-relaxed\"></p>\n</div>",
    init: function(params) {
const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const loginForm = document.getElementById("login-form");
  const signupForm = document.getElementById("signup-form");
  tabLogin.addEventListener("click", () => {
    tabLogin.classList.add("active"); tabSignup.classList.remove("active");
    loginForm.classList.remove("hidden"); signupForm.classList.add("hidden");
  });
  tabSignup.addEventListener("click", () => {
    tabSignup.classList.add("active"); tabLogin.classList.remove("active");
    signupForm.classList.remove("hidden"); loginForm.classList.add("hidden");
  });
  [loginForm, signupForm].forEach(f => f.addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("account-note").textContent = "This is a demo storefront — connect a backend (e.g. Firebase, Supabase, or your own API) to enable real customer accounts.";
  }));
    }
  },
  "shipping": {
    title: "Shipping Information \u2014 Zarif &amp; Co.",
    body: "<div>\n  <div class=\"bg-cream-dark border-b border-ink/5\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 lg:py-12\">\n      <p class=\"text-[11px] uppercase tracking-[0.15em] text-stone mb-2\"><a href=\"#/\" class=\"hover:text-gold\">Home</a> / <span class=\"text-ink\">Shipping</span></p>\n      <h1 class=\"font-display text-3xl sm:text-4xl lg:text-5xl font-medium text-ink tracking-tight\">Shipping Information</h1>\n      <p class=\"mt-2 text-sm text-stone max-w-xl\">Everything you need to know about delivery times, rates, and tracking.</p>\n    </div>\n  </div>\n  <div class=\"mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 py-14 lg:py-20 space-y-10\">\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">Domestic Shipping (Pakistan)</h2>\n      <ul class=\"space-y-2 text-[15px] text-ink/80\">\n        <li>\u2022 Free shipping on all orders above PKR 10,000</li>\n        <li>\u2022 Standard delivery: 3\u20135 business days (PKR 350 flat rate below the free-shipping threshold)</li>\n        <li>\u2022 Express delivery: 1\u20132 business days in Lahore, Karachi &amp; Islamabad (PKR 800)</li>\n        <li>\u2022 Cash on Delivery available nationwide</li>\n      </ul>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">International Shipping</h2>\n      <p class=\"text-[15px] text-ink/80 leading-relaxed\">We ship worldwide via tracked courier (DHL / TCS International). Delivery typically takes 7\u201314 business days depending on destination. Customs duties and import taxes, if applicable, are the responsibility of the customer and are not included in the item price or shipping cost.</p>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">Order Tracking</h2>\n      <p class=\"text-[15px] text-ink/80 leading-relaxed\">Once your order ships, you'll receive a tracking number by email and SMS. You can also check your order status anytime on our <a href=\"#/track-order\" class=\"text-gold underline\">Track Order</a> page.</p>\n    </div>\n    <div class=\"p-6 bg-cream-dark\">\n      <p class=\"text-sm text-ink/70\"><strong class=\"text-ink\">Note:</strong> Delivery times may be extended during sale periods (Eid, wedding season) or due to courier delays outside our control.</p>\n    </div>\n  </div>\n</div>",
    init: null
  },
  "returns": {
    title: "Returns & Exchanges \u2014 Zarif &amp; Co.",
    body: "<div>\n  <div class=\"bg-cream-dark border-b border-ink/5\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 lg:py-12\">\n      <p class=\"text-[11px] uppercase tracking-[0.15em] text-stone mb-2\"><a href=\"#/\" class=\"hover:text-gold\">Home</a> / <span class=\"text-ink\">Returns</span></p>\n      <h1 class=\"font-display text-3xl sm:text-4xl lg:text-5xl font-medium text-ink tracking-tight\">Returns &amp; Exchanges</h1>\n      <p class=\"mt-2 text-sm text-stone max-w-xl\">Easy 14-day returns on all unworn, unwashed items with tags attached.</p>\n    </div>\n  </div>\n  <div class=\"mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 py-14 lg:py-20 space-y-10\">\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">Our Return Policy</h2>\n      <p class=\"text-[15px] text-ink/80 leading-relaxed\">We want you to love what you order. If something isn't right, you can return or exchange it within 14 days of delivery, provided the item is unworn, unwashed, and has all original tags attached. Custom-stitched and made-to-measure orders are final sale.</p>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">How to Start a Return</h2>\n      <ol class=\"space-y-2 text-[15px] text-ink/80 list-decimal list-inside\">\n        <li>Email hello@zarifandco.pk with your order number and reason for return.</li>\n        <li>We'll send you a prepaid return label (domestic orders) within 24 hours.</li>\n        <li>Pack the item securely with the original tags attached and hand it to the courier.</li>\n        <li>Once received and inspected, your refund or exchange is processed within 5\u20137 business days.</li>\n      </ol>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">Refunds</h2>\n      <p class=\"text-[15px] text-ink/80 leading-relaxed\">Refunds are issued to your original payment method. For Cash on Delivery orders, refunds are issued via bank transfer or store credit, whichever you prefer.</p>\n    </div>\n  </div>\n</div>",
    init: null
  },
  "size-guide": {
    title: "Size Guide \u2014 Zarif &amp; Co.",
    body: "<div>\n  <div class=\"bg-cream-dark border-b border-ink/5\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 lg:py-12\">\n      <p class=\"text-[11px] uppercase tracking-[0.15em] text-stone mb-2\"><a href=\"#/\" class=\"hover:text-gold\">Home</a> / <span class=\"text-ink\">Size Guide</span></p>\n      <h1 class=\"font-display text-3xl sm:text-4xl lg:text-5xl font-medium text-ink tracking-tight\">Size Guide</h1>\n      <p class=\"mt-2 text-sm text-stone max-w-xl\">Find your perfect fit across our men's, women's, and kids' collections.</p>\n    </div>\n  </div>\n  <div class=\"mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 py-14 lg:py-20 space-y-12\">\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-4\">Men's Sizing (inches)</h2>\n      <div class=\"overflow-x-auto\">\n        <table class=\"w-full text-sm text-left border-collapse\">\n          <thead><tr class=\"border-b border-ink/10 text-stone uppercase text-[11px] tracking-wide\">\n            <th class=\"py-3 pr-4\">Size</th><th class=\"py-3 pr-4\">Chest</th><th class=\"py-3 pr-4\">Waist</th><th class=\"py-3\">Length</th>\n          </tr></thead>\n          <tbody class=\"text-ink/80\">\n            <tr class=\"border-b border-ink/5\"><td class=\"py-3 pr-4 font-medium text-ink\">S</td><td class=\"py-3 pr-4\">38</td><td class=\"py-3 pr-4\">32</td><td class=\"py-3\">42</td></tr>\n            <tr class=\"border-b border-ink/5\"><td class=\"py-3 pr-4 font-medium text-ink\">M</td><td class=\"py-3 pr-4\">40</td><td class=\"py-3 pr-4\">34</td><td class=\"py-3\">43</td></tr>\n            <tr class=\"border-b border-ink/5\"><td class=\"py-3 pr-4 font-medium text-ink\">L</td><td class=\"py-3 pr-4\">42</td><td class=\"py-3 pr-4\">36</td><td class=\"py-3\">44</td></tr>\n            <tr class=\"border-b border-ink/5\"><td class=\"py-3 pr-4 font-medium text-ink\">XL</td><td class=\"py-3 pr-4\">44</td><td class=\"py-3 pr-4\">38</td><td class=\"py-3\">45</td></tr>\n            <tr><td class=\"py-3 pr-4 font-medium text-ink\">XXL</td><td class=\"py-3 pr-4\">46</td><td class=\"py-3 pr-4\">40</td><td class=\"py-3\">46</td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-4\">Women's Sizing (inches)</h2>\n      <div class=\"overflow-x-auto\">\n        <table class=\"w-full text-sm text-left border-collapse\">\n          <thead><tr class=\"border-b border-ink/10 text-stone uppercase text-[11px] tracking-wide\">\n            <th class=\"py-3 pr-4\">Size</th><th class=\"py-3 pr-4\">Bust</th><th class=\"py-3 pr-4\">Waist</th><th class=\"py-3\">Hip</th>\n          </tr></thead>\n          <tbody class=\"text-ink/80\">\n            <tr class=\"border-b border-ink/5\"><td class=\"py-3 pr-4 font-medium text-ink\">XS</td><td class=\"py-3 pr-4\">32</td><td class=\"py-3 pr-4\">26</td><td class=\"py-3\">34</td></tr>\n            <tr class=\"border-b border-ink/5\"><td class=\"py-3 pr-4 font-medium text-ink\">S</td><td class=\"py-3 pr-4\">34</td><td class=\"py-3 pr-4\">28</td><td class=\"py-3\">36</td></tr>\n            <tr class=\"border-b border-ink/5\"><td class=\"py-3 pr-4 font-medium text-ink\">M</td><td class=\"py-3 pr-4\">36</td><td class=\"py-3 pr-4\">30</td><td class=\"py-3\">38</td></tr>\n            <tr><td class=\"py-3 pr-4 font-medium text-ink\">L</td><td class=\"py-3 pr-4\">38</td><td class=\"py-3 pr-4\">32</td><td class=\"py-3\">40</td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n    <div class=\"p-6 bg-cream-dark\">\n      <p class=\"text-sm text-ink/70\"><strong class=\"text-ink\">Tip:</strong> For a relaxed fit, we recommend sizing up. For custom measurements or made-to-order stitching, contact us at hello@zarifandco.pk before placing your order.</p>\n    </div>\n  </div>\n</div>",
    init: null
  },
  "faq": {
    title: "FAQ \u2014 Zarif &amp; Co.",
    body: "<div>\n  <div class=\"bg-cream-dark border-b border-ink/5\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 lg:py-12\">\n      <p class=\"text-[11px] uppercase tracking-[0.15em] text-stone mb-2\"><a href=\"#/\" class=\"hover:text-gold\">Home</a> / <span class=\"text-ink\">FAQ</span></p>\n      <h1 class=\"font-display text-3xl sm:text-4xl lg:text-5xl font-medium text-ink tracking-tight\">Frequently Asked Questions</h1>\n      <p class=\"mt-2 text-sm text-stone max-w-xl\">Answers to our most common questions about orders, shipping, and returns.</p>\n    </div>\n  </div>\n  <div class=\"mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 py-14 lg:py-20\">\n    <div id=\"faq-list\">\n        <div class=\"border-b border-ink/10 py-5\">\n          <button class=\"faq-toggle w-full flex items-center justify-between text-left gap-4\">\n            <span class=\"font-medium text-ink text-[15px]\">How long will my order take to arrive?</span>\n            <i data-lucide=\"plus\" class=\"faq-icon w-4 h-4 text-stone shrink-0\" style=\"stroke-width:1.5\"></i>\n          </button>\n          <div class=\"faq-answer hidden mt-3 text-sm text-ink/70 leading-relaxed\">Domestic orders typically arrive within 3\u20135 business days. International orders take 7\u201314 business days depending on destination. See our <a href='#/shipping' class='text-gold underline'>Shipping page</a> for full details.</div>\n        </div>\n        <div class=\"border-b border-ink/10 py-5\">\n          <button class=\"faq-toggle w-full flex items-center justify-between text-left gap-4\">\n            <span class=\"font-medium text-ink text-[15px]\">Do you offer Cash on Delivery?</span>\n            <i data-lucide=\"plus\" class=\"faq-icon w-4 h-4 text-stone shrink-0\" style=\"stroke-width:1.5\"></i>\n          </button>\n          <div class=\"faq-answer hidden mt-3 text-sm text-ink/70 leading-relaxed\">Yes, Cash on Delivery is available for all domestic orders across Pakistan.</div>\n        </div>\n        <div class=\"border-b border-ink/10 py-5\">\n          <button class=\"faq-toggle w-full flex items-center justify-between text-left gap-4\">\n            <span class=\"font-medium text-ink text-[15px]\">Can I return or exchange an item?</span>\n            <i data-lucide=\"plus\" class=\"faq-icon w-4 h-4 text-stone shrink-0\" style=\"stroke-width:1.5\"></i>\n          </button>\n          <div class=\"faq-answer hidden mt-3 text-sm text-ink/70 leading-relaxed\">Yes, unworn and unwashed items with tags attached can be returned or exchanged within 14 days of delivery. Custom-stitched pieces are final sale. See our <a href='#/returns' class='text-gold underline'>Returns page</a>.</div>\n        </div>\n        <div class=\"border-b border-ink/10 py-5\">\n          <button class=\"faq-toggle w-full flex items-center justify-between text-left gap-4\">\n            <span class=\"font-medium text-ink text-[15px]\">Do you ship internationally?</span>\n            <i data-lucide=\"plus\" class=\"faq-icon w-4 h-4 text-stone shrink-0\" style=\"stroke-width:1.5\"></i>\n          </button>\n          <div class=\"faq-answer hidden mt-3 text-sm text-ink/70 leading-relaxed\">Yes, we ship worldwide via tracked courier. Import duties, if any, are the customer's responsibility.</div>\n        </div>\n        <div class=\"border-b border-ink/10 py-5\">\n          <button class=\"faq-toggle w-full flex items-center justify-between text-left gap-4\">\n            <span class=\"font-medium text-ink text-[15px]\">Can I get a custom size or made-to-measure order?</span>\n            <i data-lucide=\"plus\" class=\"faq-icon w-4 h-4 text-stone shrink-0\" style=\"stroke-width:1.5\"></i>\n          </button>\n          <div class=\"faq-answer hidden mt-3 text-sm text-ink/70 leading-relaxed\">Yes \u2014 email us your measurements at hello@zarifandco.pk before placing your order and we'll arrange it for a small additional fee.</div>\n        </div>\n        <div class=\"border-b border-ink/10 py-5\">\n          <button class=\"faq-toggle w-full flex items-center justify-between text-left gap-4\">\n            <span class=\"font-medium text-ink text-[15px]\">How do I track my order?</span>\n            <i data-lucide=\"plus\" class=\"faq-icon w-4 h-4 text-stone shrink-0\" style=\"stroke-width:1.5\"></i>\n          </button>\n          <div class=\"faq-answer hidden mt-3 text-sm text-ink/70 leading-relaxed\">You'll receive a tracking link by email and SMS once your order ships. You can also check status on our <a href='#/track-order' class='text-gold underline'>Track Order</a> page.</div>\n        </div>\n    </div>\n    <p class=\"mt-10 text-sm text-stone\">Still have questions? <a href=\"#/contact\" class=\"text-gold underline\">Contact our support team</a>.</p>\n  </div></div>",
    init: function(params) {
document.querySelectorAll(".faq-toggle").forEach(btn => {

    });
    }
  },
  "privacy-policy": {

    body: "<div>\n  <div class=\"bg-cream-dark border-b border-ink/5\">\n    <div class=\"mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 lg:py-12\">\n      <p class=\"text-[11px] uppercase tracking-[0.15em] text-stone mb-2\"><a href=\"#/\" class=\"hover:text-gold\">Home</a> / <span class=\"text-ink\">Privacy Policy</span></p>\n      <h1 class=\"font-display text-3xl sm:text-4xl lg:text-5xl font-medium text-ink tracking-tight\">Privacy Policy</h1>\n      <p class=\"mt-2 text-sm text-stone max-w-xl\">Last updated: January 2026</p>\n    </div>\n  </div>\n  <div class=\"mx-auto max-w-3xl px-4 sm:px-6 lg:px-8 py-14 lg:py-20 space-y-8 text-[15px] text-ink/80 leading-relaxed\">\n    <p>Zarif &amp; Co. (\"we\", \"us\", \"our\") respects your privacy. This policy explains what information we collect, how we use it, and the choices you have.</p>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">Information We Collect</h2>\n      <p>When you place an order or create an account, we collect your name, email address, phone number, shipping address, and payment details (processed securely by our payment partners \u2014 we never store full card numbers). We also collect browsing data such as pages visited and items viewed to improve your shopping experience.</p>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">How We Use Your Information</h2>\n      <p>We use your information to process orders, communicate order and shipping updates, respond to customer service inquiries, and \u2014 with your consent \u2014 send marketing emails about new arrivals and offers. You can unsubscribe from marketing emails at any time.</p>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">Data Sharing</h2>\n      <p>We share order information with shipping couriers and payment processors solely to fulfill your order. We do not sell your personal information to third parties.</p>\n    </div>\n    <div>\n      <h2 class=\"font-display text-xl text-ink mb-3\">Your Rights</h2>\n      <p>You may request access to, correction of, or deletion of your personal data at any time by emailing hello@zarifandco.pk.</p>\n    </div>\n    <div class=\"p-6 bg-cream-dark\">\n      <p class=\"text-sm text-ink/70\">This is placeholder policy text for demonstration. Before going live, replace this page with a policy reviewed by a qualified legal professional, tailored to your actual data practices and applicable law.</p>\n    </div>\n  </div>\n</div>",

d without written permission.</p>\n    </div>\n    <div class=\"p-6 bg-cream-dark\">\n      <p class=\"text-sm text-ink/70\">This is placeholder terms-of-service text for demonstration. Before going live, have these terms reviewed and finalized by a qualified legal professional.</p>\n    </div>\n  </div>\n</div>",

/* ===== Router ===== */

function parseHash() {
  let hash = window.location.hash || "#/";
  hash = hash.replace(/^#/, "");
  if (!hash.startsWith("/")) hash = "/" + hash;
  const [path, queryString] = hash.slice(1).split("?");
  return { route: path || "", params: new URLSearchParams(queryString || "") };
}

function navigate() {
  const { route, params } = parseHash();
  const page = ROUTES[route] || ROUTES[""];
  document.title = page.title;
  document.getElementById("app").innerHTML = page.body;
  window.scrollTo(0, 0);
  if (typeof page.init === "function") {
    try { page.init(params); } catch (err) { console.error("Route init error:", err); }
  }
  renderCartBadge();
  if (window.lucide) lucide.createIcons();
}

document.addEventListener("DOMContentLoaded", () => {
  renderHeader();
  renderFooter();
  initMobileMenu();
  initWishlistButtons();
  initNewsletterForm();
  initSearchToggle();
  navigate();
});

window.addEventListener("hashchange", navigate);

</script>
